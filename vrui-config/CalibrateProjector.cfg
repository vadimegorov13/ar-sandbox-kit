section Vrui
    section Desktop
        section Window
            # outputName is set to the projector by the AR Sandbox tools at every start.
            outputName auto
            windowFullscreen true
        endsection

        section Tools
            section DefaultTools
                # 1 captures a tie point; 2 re-captures the background.
                section CalibrationTool
                    toolClass CaptureTool
                    bindings ((Mouse, 1, 2))
                endsection
            endsection
        endsection
    endsection
endsection
