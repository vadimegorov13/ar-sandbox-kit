section Vrui
    section Desktop
        inhibitScreenSaver true

        section MouseAdapter
            mouseIdleTimeout 5.0
        endsection

        section Window
            # outputName is set to the projector by the AR Sandbox tools at every start.
            outputName auto
            windowFullscreen true
        endsection

        section Tools
            section DefaultTools
                # 1 adds global rain; 2 drains water.
                section WaterTool
                    toolClass GlobalWaterTool
                    bindings ((Mouse, 1, 2))
                endsection
            endsection
        endsection
    endsection
endsection
